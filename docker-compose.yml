name: dns-duty

# Three roles share one image and one SQLite state plane on the `dnsdata`
# volume:
#   auth     -- local authoritative endpoint for the fixed domain (UDP 5354)
#   resolver -- caching/serve-stale UDP resolver (UDP 5353, published)
#   web      -- FastAPI operations console (HTTP 8000, published)
#
# Answer authentication uses one shared HMAC-SHA256 key.  If DNS_HMAC_KEY is
# not set, the key is generated once into /data/hmac.key on the shared volume,
# so auth and the resolver always agree and a restart reuses the same key.
# To pin your own key instead, set DNS_HMAC_KEY (and optionally
# DNS_HMAC_KEY_ID) in the environment of all three services.

services:
  auth:
    build: .
    command: ["python", "-m", "app.auth_server"]
    environment:
      DB_PATH: /data/app.db
      FIXED_DOMAIN: service.example
      AUTH_PORT: "5354"
      HMAC_KEY_FILE: /data/hmac.key
      # DNS_HMAC_KEY: "change-me-in-production"   # optional explicit key
      # DNS_HMAC_KEY_ID: "k1"
    volumes:
      - dnsdata:/data
    restart: unless-stopped

  resolver:
    build: .
    command: ["python", "-m", "app.resolver"]
    environment:
      DB_PATH: /data/app.db
      FIXED_DOMAIN: service.example
      HMAC_KEY_FILE: /data/hmac.key
      RESOLVER_PORT: "5353"
      AUTH_HOST: auth
      AUTH_PORT: "5354"
      FRESH_TTL: "5"        # successful answers are fresh for 5s
      STALE_WINDOW: "20"    # stale A usable at most 20s past expiry
      UPSTREAM_TIMEOUT: "2" # seconds waiting for the authoritative endpoint
    ports:
      - "5353:5353/udp"
    volumes:
      - dnsdata:/data
    depends_on:
      - auth
    restart: unless-stopped

  web:
    build: .
    command: ["python", "-m", "app.web"]
    environment:
      DB_PATH: /data/app.db
      FIXED_DOMAIN: service.example
      HMAC_KEY_FILE: /data/hmac.key
      WEB_PORT: "8000"
      RESOLVER_HOST: resolver
      RESOLVER_PORT: "5353"
    ports:
      - "8000:8000"
    volumes:
      - dnsdata:/data
    depends_on:
      - resolver
      - auth
    restart: unless-stopped

volumes:
  dnsdata:
